<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Optional test-host fallback when Linux has no system font configuration.
     Run: FONTCONFIG_FILE="$PWD/scripts/fonts.conf" npm run test:e2e
     The application itself serves fonts with next/font/local. -->
<fontconfig>
  <dir prefix="relative">../public/fonts</dir>
  <cachedir>/tmp/accessready-font-cache</cachedir>
  <alias><family>sans-serif</family><prefer><family>DM Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Lora</family></prefer></alias>
</fontconfig>
